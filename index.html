<link rel="stylesheet" href="https://s4.zstatic.net/ajax/libs/lxgw-wenkai-webfont/1.7.0/lxgwwenkai-regular.min.css" media="print" onload="this.media='all'">

<style>
/* Hallmark · macrostructure: Index-First · genre: editorial · theme: warm-paper · design-system: design.md */
/* ========== CSS 变量 ========== */
:root {
    --font-display: "LXGW WenKai", "Noto Serif SC", "PingFang SC", serif;
    --font-body:    "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    --font-mono:    "JetBrains Mono", "SF Mono", "Cascadia Code", monospace;

    --color-paper:       oklch(97% 0.012 80);
    --color-paper-2:     oklch(93% 0.014 78);
    --color-paper-3:     oklch(88% 0.010 75);
    --color-rule:        oklch(82% 0.012 72);
    --color-rule-strong: oklch(70% 0.010 68);
    --color-muted:       oklch(55% 0.008 65);
    --color-ink:         oklch(22% 0.015 60);
    --color-ink-2:       oklch(35% 0.010 58);
    --color-accent:      oklch(58% 0.16 62);
    --color-accent-hover:oklch(50% 0.17 60);
    --color-accent-soft: oklch(58% 0.16 62 / 0.12);
    --color-focus:       oklch(52% 0.18 55);

    --space-xs: 0.5rem;   --space-sm: 0.75rem;  --space-md: 1rem;
    --space-lg: 1.5rem;   --space-xl: 2.5rem;

    --text-sm: 0.875rem;  --text-base: 1rem;    --text-md: 1.125rem;
    --text-lg: 1.375rem;  --text-xl: 1.75rem;

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --dur-short: 220ms;

    --card-bg: oklch(97% 0.012 80 / 0.82);
    --card-bg-solid: oklch(97% 0.012 80 / 0.95);
    --shadow-sm: 0 2px 12px oklch(20% 0.01 60 / 0.06);
    --shadow-md: 0 6px 20px oklch(20% 0.01 60 / 0.10);
    --shadow-hover: 0 12px 32px -6px oklch(20% 0.01 60 / 0.15);
    --overlay-light: oklch(97% 0.012 80 / 0.25);
    --overlay-dark: oklch(0% 0 0 / 0.30);
}

[data-theme="dark"] {
    --color-paper:       oklch(15% 0.010 70);
    --color-paper-2:     oklch(19% 0.012 68);
    --color-paper-3:     oklch(25% 0.010 65);
    --color-rule:        oklch(28% 0.008 62);
    --color-rule-strong: oklch(40% 0.008 60);
    --color-muted:       oklch(55% 0.006 55);
    --color-ink:         oklch(94% 0.006 80);
    --color-ink-2:       oklch(80% 0.005 72);
    --color-accent:      oklch(68% 0.14 65);
    --color-accent-hover:oklch(60% 0.15 63);
    --color-accent-soft: oklch(68% 0.14 65 / 0.10);
    --color-focus:       oklch(65% 0.16 58);

    --card-bg: oklch(19% 0.012 68 / 0.82);
    --card-bg-solid: oklch(19% 0.012 68 / 0.95);
    --shadow-sm: 0 2px 12px oklch(0% 0 0 / 0.25);
    --shadow-md: 0 6px 20px oklch(0% 0 0 / 0.35);
    --shadow-hover: 0 12px 32px -6px oklch(0% 0 0 / 0.45);
    --overlay-light: oklch(0% 0 0 / 0.02);
    --overlay-dark: oklch(0% 0 0 / 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--color-paper);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem;
    padding-top: max(2.5rem, env(safe-area-inset-top));
    padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
    transition: background-color 0.5s ease, color 0.5s ease;
    position: relative;
}

/* 背景层 */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    transition: background-image 1.2s ease-in-out, opacity 1.2s ease-in-out;
    opacity: 1;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    transition: background-color 0.5s ease;
    background-color: var(--overlay-light);
}

[data-theme="dark"] body::after {
    background-color: var(--overlay-dark);
}

/* 微妙的噪点纹理 */
body .texture {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
}

.page-header,
.links-container,
.footer-section { position: relative; z-index: 2; }

/* ========== 头部 ========== */
.page-header {
    text-align: center;
    margin-bottom: 2.2rem;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
}

.page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 450;
    color: var(--color-ink);
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 0.7rem 2rem;
    border-radius: 100px;
    border: 1px solid var(--color-rule);
    margin: 0;
    box-shadow: var(--shadow-sm);
    transition: background 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    animation: headerIn 0.8s var(--ease-out) both;
}

@keyframes headerIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
}

.subtitle-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--color-rule);
    border-radius: 100px;
    padding: 0.45rem 0.9rem 0.45rem 1.5rem;
    box-shadow: var(--shadow-sm);
    color: var(--color-ink-2);
    font-size: 0.88rem;
    transition: background 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    animation: headerIn 0.8s 0.1s var(--ease-out) both;
}

.subtitle-text {
    font-weight: 400;
    letter-spacing: 0.4px;
}

/* 装饰分隔线 */
.header-divider {
    width: 36px;
    height: 2px;
    border-radius: 1px;
    background: var(--color-rule);
    margin: 0.1rem 0;
}

/* 链接计数 */
.link-count {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-muted);
    letter-spacing: 0.3px;
    animation: headerIn 0.8s 0.2s var(--ease-out) both;
}

.theme-btn {
    background: var(--color-paper-2);
    border: 1px solid var(--color-rule);
    border-radius: 50px;
    padding: 0.35rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--color-ink);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
    font-family: var(--font-body);
    line-height: 1.2;
    white-space: nowrap;
}

.theme-btn:hover {
    background: var(--color-paper-3);
    border-color: var(--color-accent);
    box-shadow: 0 0 0 4px var(--color-accent-soft);
    transform: translateY(-1px);
}

/* ========== 链接列表 ========== */
.links-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    padding: 0 0.5rem;
}

.pill-link {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 0.75rem;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--color-rule);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: clamp(0.92rem, 2vw, 1.05rem);
    padding: clamp(0.75rem, 2vh, 0.95rem) clamp(1.5rem, 4vw, 2rem);
    border-radius: 100px;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: background var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
    white-space: nowrap;
    letter-spacing: 0.3px;
    line-height: 1.3;
    cursor: pointer;
    width: 100%;
    min-height: 50px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative;
    overflow: hidden;
    user-select: none;
    opacity: 0;
    transform: translateY(16px);
    animation: linkIn 0.5s var(--ease-out) forwards;
}

@keyframes linkIn {
    to { opacity: 1; transform: translateY(0); }
}

.pill-link:active { transform: scale(0.97); }

@media (hover: hover) {
    .pill-link:hover {
        background: var(--color-paper-3);
        border-color: var(--color-accent);
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
        color: var(--color-ink);
    }
}

.pill-link:focus-visible {
    outline: 3px solid var(--color-focus);
    outline-offset: 4px;
    outline-style: solid;
    transition: none;
}

.link-avatar {
    width: clamp(28px, 5vw, 36px);
    height: clamp(28px, 5vw, 36px);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--color-paper-2);
    transition: background var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
}

.link-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    border-radius: inherit;
}

.link-avatar .fallback-text {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--color-ink-2);
    font-size: clamp(0.82rem, 2vw, 1rem);
    line-height: 1;
}

@media (hover: hover) {
    .pill-link:hover .link-avatar {
        background: var(--color-paper-3);
        transform: scale(1.06);
    }
}

/* ========== 页脚（Ft2 Inline 单行） ========== */
.footer-section {
    margin-top: 2.5rem;
    width: 100%;
    max-width: 600px;
    position: relative;
    z-index: 2;
    padding-top: var(--space-lg);
    border-top: 1px solid var(--color-rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.6rem;
    animation: headerIn 0.8s 0.3s var(--ease-out) both;
}

.footer-left {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}

#runtime {
    font-size: clamp(11px, 1.5vw, 13px);
    color: var(--color-ink-2);
}

#runtime span {
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--color-accent);
}

#hitokoto-container {
    font-size: clamp(0.8rem, 1.4vw, 0.9rem);
    color: var(--color-ink-2);
    line-height: 1.6;
    min-height: 2.5em;
    text-align: left;
}

#hitokoto-from {
    display: block;
    font-size: clamp(0.7rem, 1.2vw, 0.78rem);
    color: var(--color-muted);
    margin-top: 2px;
}

.footer-right {
    display: flex;
    align-items: center;
    gap: 0.8rem;
}

.admin-link {
    font-size: 0.8rem;
    color: var(--color-muted);
    text-decoration: none;
    transition: color var(--dur-short) var(--ease-out);
}

.admin-link:hover {
    color: var(--color-accent);
}

.loading-skeleton {
    background: linear-gradient(110deg, transparent 30%, var(--color-paper-2) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 1.8s infinite;
    border-radius: 6px;
    display: inline-block;
    min-width: 60%;
    height: 1em;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* 减少动画 */
@media (prefers-reduced-motion: reduce) {
    .pill-link, .page-header h1, .subtitle-container, .link-count, .footer-section {
        animation: none;
        opacity: 1;
        transform: none;
    }
    .loading-skeleton { animation: none; }
    .theme-btn, .pill-link { transition: none; }
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
    body { padding: 2rem 0.8rem; padding-top: max(2rem, env(safe-area-inset-top)); padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
    .links-container { gap: 0.7rem; max-width: 500px; }
    .page-header { margin-bottom: 1.8rem; }
}

@media (max-width: 480px) {
    body { padding: 1.2rem 0.5rem; padding-top: max(1.2rem, env(safe-area-inset-top)); padding-bottom: max(1.2rem, env(safe-area-inset-bottom)); }
    .links-container { gap: 0.6rem; max-width: 420px; }
    .pill-link {
        border-radius: 80px;
        border-width: 1px;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.6rem 1.2rem;
    }
    .page-header { margin-bottom: 1.4rem; }
    .page-header h1 { padding: 0.55rem 1.4rem; font-size: 1.35rem; }
    .footer-section { margin-top: 1.8rem; }
    .link-avatar { border-radius: 10px; width: 28px; height: 28px; }
}
</style>
</head>
<body>
    <div class="texture"></div>

    <header class="page-header" role="banner">
        <h1>🌾 友邻聚落</h1>
        <div class="subtitle-container">
            <span class="subtitle-text">临渊羡鱼 · 且行且歌</span>
            <button class="theme-btn" id="themeToggleBtn" aria-label="切换深色/浅色模式" title="切换深浅模式">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">深色</span>
            </button>
        </div>
        <div class="header-divider"></div>
        <div class="link-count" id="linkCount">0 个友邻</div>
    </header>

    <main class="links-container" id="linksContainer" role="list" aria-label="友情链接列表">
        <div style="text-align: center; padding: 2rem; color: var(--color-ink-2);">
            <div class="loading-skeleton" style="width: 100%; height: 50px; border-radius: 100px;"></div>
        </div>
    </main>

    <footer class="footer-section" role="contentinfo">
        <div class="footer-left">
            <div id="runtime">
                运行 <span aria-live="polite">0天 00:00:00</span>
            </div>
            <div id="hitokoto-container">
                <span id="hitokoto-text" aria-live="polite">
                    <span class="loading-skeleton" style="width: 200px;"></span>
                </span>
                <span id="hitokoto-from"></span>
            </div>
        </div>
        <div class="footer-right">
            <a href="/admin" class="admin-link">管理</a>
        </div>
    </footer>

<script>
(function() {
    const CONFIG = {
        startDate: '2025-12-01 00:00:00',
        settingsStorageKey: 'nav_settings',
        bgImages: [
            'https://t.alcy.cc/moez',
            'https://t.alcy.cc/moez?2',
            'https://t.alcy.cc/moez?3',
            'https://t.alcy.cc/moez?4',
            'https://t.alcy.cc/moez?5'
        ],
        bgRotateInterval: 12000,
        bgFadeDuration: 1200,
        hitokotoApi: 'https://v1.hitokoto.cn/?c=f&encode=json',
        hitokotoInterval: 10000,
        hitokotoTimeout: 5000,
        apiBase: '/api/links',
        fallbackHitokotos: [
            '🌱 学而时习之，不亦说乎。',
            '🌱 静以修身，俭以养德。',
            '🌱 千里之行，始于足下。',
            '🌱 博观而约取，厚积而薄发。',
            '🌱 路漫漫其修远兮，吾将上下而求索。'
        ],
        defaultLinks: [
            { name: '临渊羡鱼博客', url: 'https://blog.fnosi.top', fallback: '临' },
            { name: '临渊羡鱼图床', url: 'https://imge.fnosi.top', fallback: '图' },
            { name: '文件快递柜', url: 'https://file.fnosi.top', fallback: '📁' },
            { name: '飞牛NAS', url: 'https://fnos.fnosi.top', fallback: '🐮' },
            { name: '临渊羡鱼资源站', url: 'https://list.fnosi.top', fallback: '📦' },
            { name: '临渊羡鱼标签页', url: 'https://tab.fnosi.top', fallback: '🏷️' }
        ]
    };

    const body = document.body;
    const linksContainer = document.getElementById('linksContainer');
    const linkCount = document.getElementById('linkCount');
    const runtimeSpan = document.querySelector('#runtime span');
    const hitokotoText = document.getElementById('hitokoto-text');
    const hitokotoFrom = document.getElementById('hitokoto-from');
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');

    // ========== 加载链接 ==========
    async function loadLinks() {
        try {
            const response = await fetch(CONFIG.apiBase);
            if (!response.ok) throw new Error('API 响应错误');
            const data = await response.json();
            if (data.links && data.links.length > 0) {
                const active = data.links.filter(l => l.status === 'active');
                renderLinks(active);
                return;
            }
        } catch (e) {
            console.warn('无法从 API 加载链接，使用默认链接:', e.message);
        }
        renderLinks(CONFIG.defaultLinks);
    }

    function renderLinks(links) {
        if (!links || links.length === 0) {
            linksContainer.innerHTML = '<div style="text-align:center;padding:2.5rem;color:var(--color-muted);animation:headerIn .6s ease both"><p style="font-size:2rem;margin-bottom:.5rem">📭</p><p>暂无链接</p></div>';
            if (linkCount) linkCount.textContent = '0 个友邻';
            return;
        }
        if (linkCount) linkCount.textContent = links.length + ' 个友邻';
        linksContainer.innerHTML = links.map((link, i) => `
            <a href="${link.url}" class="pill-link" target="_blank" rel="noopener noreferrer" role="listitem" title="${link.name}" style="animation-delay:${0.06 * i}s">
                <span class="link-avatar">
                    <img src="https://faviconsnap.com/api/favicon?url=${encodeURIComponent(link.url)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
                    <span class="fallback-text" style="display:none;">${link.fallback || link.name.charAt(0)}</span>
                </span>
                <span>${link.name}</span>
            </a>
        `).join('');
    }

    // ========== 背景淡入淡出轮转 ==========
    const bgLayer = document.createElement('div');
    bgLayer.style.cssText = 'position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-attachment:fixed;transition:opacity 1.2s ease-in-out;opacity:0;pointer-events:none;';
    document.body.insertBefore(bgLayer, document.body.firstChild);

    let bgIndex = 0, bgActive = false;
    function rotateBackground() {
        if (!CONFIG.bgImages.length) return;
        const next = CONFIG.bgImages[bgIndex];
        if (!bgActive) {
            bgLayer.style.backgroundImage = `url('${next}')`;
            bgLayer.style.opacity = '1';
            bgActive = true;
        } else {
            const prev = bgLayer;
            const curr = bgLayer.cloneNode();
            curr.style.backgroundImage = `url('${next}')`;
            curr.style.opacity = '0';
            document.body.insertBefore(curr, document.body.firstChild);
            requestAnimationFrame(() => { curr.style.opacity = '1'; });
            setTimeout(() => { prev.remove(); }, 1300);
        }
        bgIndex = (bgIndex + 1) % CONFIG.bgImages.length;
    }
    rotateBackground();
    setInterval(rotateBackground, CONFIG.bgRotateInterval);

    // ========== 运行时间 ==========
    function getStartDate() {
        try {
            const s = localStorage.getItem(CONFIG.settingsStorageKey);
            if (s) { const p = JSON.parse(s); if (p.startDate) return p.startDate; }
        } catch(e) {}
        return CONFIG.startDate;
    }
    const startDate = new Date(getStartDate());

    function updateRuntime() {
        if (!runtimeSpan) return;
        const now = new Date();
        let diff = Math.floor((now - startDate) / 1000);
        if (diff < 0) diff = 0;
        const days = Math.floor(diff / 86400);
        diff %= 86400;
        const h = String(Math.floor(diff / 3600)).padStart(2, '0');
        diff %= 3600;
        const m = String(Math.floor(diff / 60)).padStart(2, '0');
        const s = String(diff % 60).padStart(2, '0');
        runtimeSpan.textContent = `${days}天 ${h}:${m}:${s}`;
    }
    updateRuntime();
    setInterval(updateRuntime, 1000);

    // ========== 一言 ==========
    let hitokotoTimer;
    function fetchHitokoto() {
        if (!hitokotoText) return;
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), CONFIG.hitokotoTimeout);
        fetch(CONFIG.hitokotoApi, { signal: ctrl.signal })
            .then(r => { clearTimeout(tid); if (!r.ok) throw new Error(''); return r.json(); })
            .then(d => {
                if (d && d.hitokoto) {
                    hitokotoText.style.opacity = '0';
                    setTimeout(() => {
                        hitokotoText.textContent = '「' + d.hitokoto + '」';
                        hitokotoFrom.textContent = d.from ? '—— ' + d.from : '';
                        hitokotoText.style.opacity = '1';
                    }, 400);
                } else throw new Error('');
            })
            .catch(() => {
                const fb = CONFIG.fallbackHitokotos;
                hitokotoText.style.opacity = '0';
                setTimeout(() => {
                    hitokotoText.textContent = fb[Math.floor(Math.random() * fb.length)];
                    hitokotoFrom.textContent = '';
                    hitokotoText.style.opacity = '1';
                }, 400);
            });
    }
    fetchHitokoto();
    hitokotoTimer = setInterval(fetchHitokoto, CONFIG.hitokotoInterval);

    // ========== 主题切换 ==========
    const THEME_KEY = 'theme';
    function applyTheme(theme) {
        if (theme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            if (themeIcon) themeIcon.textContent = '☀️';
            if (themeLabel) themeLabel.textContent = '浅色';
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#1a1512');
        } else {
            document.documentElement.removeAttribute('data-theme');
            if (themeIcon) themeIcon.textContent = '🌙';
            if (themeLabel) themeLabel.textContent = '深色';
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f5ebe0');
        }
        localStorage.setItem(THEME_KEY, theme);
    }

    const savedTheme = localStorage.getItem(THEME_KEY);
    applyTheme(savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    themeToggleBtn?.addEventListener('click', () => {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
        if (!localStorage.getItem(THEME_KEY)) applyTheme(e.matches ? 'dark' : 'light');
    });

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', () => {
        loadLinks();
        try {
            const s = localStorage.getItem(CONFIG.settingsStorageKey);
            if (s) {
                const p = JSON.parse(s);
                if (p.title) document.querySelector('.page-header h1').textContent = p.title;
                if (p.subtitle) document.querySelector('.subtitle-text').textContent = p.subtitle;
            }
        } catch(e) {}
    });

    window.addEventListener('beforeunload', () => { if (hitokotoTimer) clearInterval(hitokotoTimer); });
})();
</script>
</body>
</html>
