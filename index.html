<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes, viewport-fit=cover">
<title>临渊羡鱼 · 导航页</title>

<!-- 字体：仅标题字体 LXGW WenKai 走 zstatic 分片按需加载；正文/等宽用系统字体（零下载） -->
<link rel="stylesheet" href="https://s4.zstatic.net/ajax/libs/lxgw-wenkai-webfont/1.7.0/lxgwwenkai-regular.min.css" media="print" onload="this.media='all'">

<style>
/* Hallmark · macrostructure: Index-First · genre: editorial · theme: warm-paper · design-system: design.md */
/* ========== CSS 变量 ========== */
:root {
    /* 正文/等宽用系统字体：零下载、零 FOIT（原自托管 Inter+JetBrains 共 103KB，
       弱网下占用首屏带宽 2~3s）。标题保留 LXGW WenKai（走 zstatic 按 unicode-range 分片按需加载） */
    --font-display: "LXGW WenKai", "Noto Serif SC", "PingFang SC", serif;
    --font-body:    -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, "Segoe UI", Roboto, sans-serif;
    --font-mono:    ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;

    /* 注意：本变量块与 admin.html 的 :root 是同一套设计令牌，修改主题色需两处同步。
       刻意内联而非抽公共 CSS：外链样式会让首屏先无样式渲染（FOUC 闪白） */
    --color-paper:       oklch(97% 0.012 80);
    --color-paper-2:     oklch(93% 0.014 78);
    --color-paper-3:     oklch(88% 0.010 75);
    --color-rule:        oklch(82% 0.012 72);
    --color-rule-strong: oklch(70% 0.010 68);
    --color-muted:       oklch(55% 0.008 65);
    --color-ink:         oklch(22% 0.015 60);
    --color-ink-2:       oklch(35% 0.010 58);
    --color-accent:      oklch(58% 0.16 62);
    --color-accent-hover:oklch(50% 0.17 60);
    --color-accent-soft: oklch(58% 0.16 62 / 0.12);
    --color-focus:       oklch(52% 0.18 55);

    --space-3xs: 0.125rem; --space-2xs: 0.25rem; --space-xs: 0.5rem;
    --space-sm: 0.75rem;  --space-md: 1rem;      --space-lg: 1.5rem;
    --space-xl: 2.5rem;   --space-2xl: 4rem;      --space-3xl: 6rem;

    --text-xs: 0.75rem;   --text-sm: 0.875rem;    --text-base: 1rem;
    --text-md: 1.125rem;  --text-lg: 1.375rem;    --text-xl: 1.75rem;
    --text-2xl: 2.25rem;  --text-3xl: 2.75rem;    --text-display: clamp(2rem, 5vw, 3.5rem);

    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-in:  cubic-bezier(0.7, 0, 0.84, 0);
    --dur-micro: 120ms;   --dur-short: 220ms;     --dur-long: 420ms;

    --color-success: oklch(55% 0.16 160);
    --color-danger:  oklch(50% 0.18 25);

    --card-bg: oklch(97% 0.012 80 / 0.82);
    --card-bg-solid: oklch(97% 0.012 80 / 0.95);
    --shadow-sm: 0 2px 12px oklch(20% 0.01 60 / 0.06);
    --shadow-md: 0 6px 20px oklch(20% 0.01 60 / 0.10);
    --shadow-hover: 0 12px 32px -6px oklch(20% 0.01 60 / 0.15);
    --overlay-light: oklch(97% 0.012 80 / 0.25);
    --overlay-dark: oklch(0% 0 0 / 0.30);
}

[data-theme="dark"] {
    --color-paper:       oklch(15% 0.010 70);
    --color-paper-2:     oklch(19% 0.012 68);
    --color-paper-3:     oklch(25% 0.010 65);
    --color-rule:        oklch(28% 0.008 62);
    --color-rule-strong: oklch(40% 0.008 60);
    --color-muted:       oklch(55% 0.006 55);
    --color-ink:         oklch(94% 0.006 80);
    --color-ink-2:       oklch(80% 0.005 72);
    --color-accent:      oklch(68% 0.14 65);
    --color-accent-hover:oklch(60% 0.15 63);
    --color-accent-soft: oklch(68% 0.14 65 / 0.10);
    --color-focus:       oklch(65% 0.16 58);

    --color-success: oklch(60% 0.14 160);
    --color-danger:  oklch(58% 0.16 25);

    --card-bg: oklch(19% 0.012 68 / 0.82);
    --card-bg-solid: oklch(19% 0.012 68 / 0.95);
    --shadow-sm: 0 2px 12px oklch(0% 0 0 / 0.25);
    --shadow-md: 0 6px 20px oklch(0% 0 0 / 0.35);
    --shadow-hover: 0 12px 32px -6px oklch(0% 0 0 / 0.45);
    --overlay-light: oklch(0% 0 0 / 0.02);
    --overlay-dark: oklch(0% 0 0 / 0.35);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--color-paper);
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem;
    padding-top: max(2.5rem, env(safe-area-inset-top));
    padding-bottom: max(2.5rem, env(safe-area-inset-bottom));
    transition: background-color 0.5s ease, color 0.5s ease;
    position: relative;
}

/* 背景层 */
body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    /* 勿加 background-attachment: fixed：iOS Safari 下与 position:fixed 同用会背景丢失/滚动卡顿 */
    opacity: 1;
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    transition: background-color 0.5s ease;
    background-color: var(--overlay-light);
}

[data-theme="dark"] body::after {
    background-color: var(--overlay-dark);
}

/* 微妙的噪点纹理 */
body .texture {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
}

.page-header,
.links-container,
.footer-section { position: relative; z-index: 2; }

/* ========== 头部 ========== */
.page-header {
    text-align: center;
    margin-bottom: 2.2rem;
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
}

.page-header h1 {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 4vw, 2rem);
    font-weight: 450;
    color: var(--color-ink);
    letter-spacing: 0.5px;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    justify-content: center;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    padding: 0.7rem 2rem;
    border-radius: 100px;
    border: 1px solid var(--color-rule);
    margin: 0;
    box-shadow: var(--shadow-sm);
    transition: background 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    animation: headerIn 0.8s var(--ease-out) both;
    text-align: center;
}

@keyframes headerIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
}

.subtitle-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    flex-wrap: wrap;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--color-rule);
    border-radius: 100px;
    padding: 0.45rem 0.9rem 0.45rem 1.5rem;
    box-shadow: var(--shadow-sm);
    color: var(--color-ink-2);
    font-size: 0.88rem;
    transition: background 0.4s var(--ease-out), border-color 0.4s var(--ease-out);
    animation: headerIn 0.8s 0.1s var(--ease-out) both;
    text-align: center;
}

.subtitle-text {
    font-weight: 400;
    letter-spacing: 0.4px;
}

/* 装饰分隔线 */
.header-divider {
    width: 36px;
    height: 2px;
    border-radius: 1px;
    background: var(--color-rule);
    margin: 0.1rem 0;
}

/* 链接计数 */
.link-count {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: var(--color-muted);
    letter-spacing: 0.3px;
    animation: headerIn 0.8s 0.2s var(--ease-out) both;
    text-align: center;
}

.theme-btn {
    background: var(--color-paper-2);
    border: 1px solid var(--color-rule);
    border-radius: 50px;
    padding: 0.35rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--color-ink);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: background var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
    font-family: var(--font-body);
    line-height: 1.2;
    white-space: nowrap;
    text-align: center;
}

.theme-btn:hover {
    background: var(--color-paper-3);
    border-color: var(--color-accent);
    box-shadow: 0 0 0 4px var(--color-accent-soft);
    transform: translateY(-1px);
}

/* ========== 链接列表 ========== */
.links-container {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.8rem;
    padding: 0 0.5rem;
}

.pill-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--color-rule);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: clamp(0.92rem, 2vw, 1.05rem);
    padding: clamp(0.75rem, 2vh, 0.95rem) clamp(1.5rem, 4vw, 2rem);
    border-radius: 100px;
    text-decoration: none;
    box-shadow: var(--shadow-sm);
    transition: background var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
    letter-spacing: 0.3px;
    line-height: 1.3;
    cursor: pointer;
    width: 100%;
    min-height: 50px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    position: relative;
    overflow: hidden;
    user-select: none;
    opacity: 0;
    transform: translateY(16px);
    animation: linkIn 0.5s var(--ease-out) forwards;
    text-align: center;
    content-visibility: auto;
    contain-intrinsic-size: 50px;
}

@keyframes linkIn {
    to { opacity: 1; transform: translateY(0); }
}

.pill-link:active { transform: scale(0.97); }

@media (hover: hover) {
    .pill-link:hover {
        background: var(--color-paper-3);
        border-color: var(--color-accent);
        box-shadow: var(--shadow-hover);
        transform: translateY(-2px);
        color: var(--color-ink);
    }
}

.pill-link:focus-visible {
    outline: 3px solid var(--color-focus);
    outline-offset: 4px;
    outline-style: solid;
    transition: none;
}

.link-avatar {
    width: clamp(28px, 5vw, 36px);
    height: clamp(28px, 5vw, 36px);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    overflow: hidden;
    background: var(--color-paper-2);
    transition: background var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
}

.link-avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    border-radius: inherit;
}

.link-avatar .fallback-text {
    font-family: var(--font-display);
    font-weight: 600;
    color: var(--color-ink-2);
    font-size: clamp(0.82rem, 2vw, 1rem);
    line-height: 1;
}

@media (hover: hover) {
    .pill-link:hover .link-avatar {
        background: var(--color-paper-3);
        transform: scale(1.06);
    }
}

/* ========== 页脚 ========== */
.footer-section {
    margin-top: 2.5rem;
    width: 100%;
    max-width: 600px;
    position: relative;
    z-index: 2;
    padding-top: var(--space-lg);
    border-top: 1px solid var(--color-rule);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.6rem;
    animation: headerIn 0.8s 0.3s var(--ease-out) both;
    text-align: center;
}

.footer-left {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
}

#runtime {
    font-size: clamp(11px, 1.5vw, 13px);
    color: var(--color-ink-2);
}

#runtime span {
    font-family: var(--font-mono);
    font-weight: 500;
    color: var(--color-accent);
}

#hitokoto-container {
    font-size: clamp(0.8rem, 1.4vw, 0.9rem);
    color: var(--color-ink-2);
    line-height: 1.6;
    min-height: 2.5em;
    text-align: center;
}

#hitokoto-from {
    display: block;
    font-size: clamp(0.7rem, 1.2vw, 0.78rem);
    color: var(--color-muted);
    margin-top: 2px;
    text-align: center;
}

.footer-right {
    display: flex;
    align-items: center;
    gap: 0.8rem;
}

.admin-link {
    font-size: 0.8rem;
    color: var(--color-muted);
    text-decoration: none;
    transition: color var(--dur-short) var(--ease-out);
}

.admin-link:hover {
    color: var(--color-accent);
}

.loading-skeleton {
    background: linear-gradient(110deg, transparent 30%, var(--color-paper-2) 50%, transparent 70%);
    background-size: 200% 100%;
    animation: shimmer 1.8s infinite;
    border-radius: 6px;
    display: inline-block;
    min-width: 60%;
    height: 1em;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

/* 减少动画 */
@media (prefers-reduced-motion: reduce) {
    .pill-link, .page-header h1, .subtitle-container, .link-count, .footer-section {
        animation: none;
        opacity: 1;
        transform: none;
    }
    .loading-skeleton { animation: none; }
    .theme-btn, .pill-link { transition: none; }
}

/* ========== 响应式 ========== */
@media (max-width: 768px) {
    body { padding: 2rem 0.8rem; padding-top: max(2rem, env(safe-area-inset-top)); padding-bottom: max(2rem, env(safe-area-inset-bottom)); }
    .links-container { gap: 0.7rem; max-width: 500px; }
    .page-header { margin-bottom: 1.8rem; }
    .footer-section { justify-content: center; }
}

@media (max-width: 480px) {
    body { padding: 1.2rem 0.5rem; padding-top: max(1.2rem, env(safe-area-inset-top)); padding-bottom: max(1.2rem, env(safe-area-inset-bottom)); }
    .links-container { gap: 0.6rem; max-width: 420px; }
    .pill-link {
        border-radius: 80px;
        border-width: 1px;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0.6rem 1.2rem;
        text-align: center;
    }
    .page-header { margin-bottom: 1.4rem; }
    .page-header h1 { padding: 0.55rem 1.4rem; font-size: 1.35rem; }
    .footer-section { margin-top: 1.8rem; justify-content: center; }
    .link-avatar { border-radius: 10px; width: 28px; height: 28px; }
    .footer-left { justify-content: center; }
    .footer-right { justify-content: center; }
}
</style>
</head>
<body>
    <div class="texture"></div>

    <header class="page-header" role="banner">
        <h1>🌾 友邻聚落</h1>
        <div class="subtitle-container">
            <span class="subtitle-text">临渊羡鱼 · 且行且歌</span>
            <button class="theme-btn" id="themeToggleBtn" aria-label="切换深色/浅色模式" title="切换深浅模式">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">深色</span>
            </button>
        </div>
        <div class="header-divider"></div>
        <div class="link-count" id="linkCount">0 个友邻</div>
    </header>

    <main class="links-container" id="linksContainer" role="list" aria-label="友情链接列表">
        <div style="text-align: center; padding: 2rem; color: var(--color-ink-2);">
            <div class="loading-skeleton" style="width: 100%; height: 50px; border-radius: 100px;"></div>
        </div>
    </main>

    <footer class="footer-section" role="contentinfo">
        <div class="footer-left">
            <div id="runtime">
                运行 <span aria-live="polite">0天 00:00:00</span>
            </div>
            <div id="hitokoto-container">
                <span id="hitokoto-text" aria-live="polite">
                    <span class="loading-skeleton" style="width: 200px;"></span>
                </span>
                <span id="hitokoto-from"></span>
            </div>
        </div>
        <div class="footer-right">
            <a href="/admin.html" class="admin-link">管理</a>
        </div>
    </footer>

<script>
(function () {
    'use strict';

    // ========== 配置 ==========
    var CONFIG = {
        startDate: '2025-12-01 00:00:00',
        settingsKey: 'nav_settings',
        linksCacheKey: 'nav_links_cache',
        linksCacheMaxAge: 60 * 1000,
        apiTimeout: 8000,
        linksUpdatedKey: 'nav_links_updated_at',
        iconCacheKey: 'nav_icon_cache_v1',
        iconConcurrency: 2,
        iconTimeout: 6000,
        themeKey: 'theme',
        apiLinks: '/api/links',
        apiSettings: '/api/settings',
        iconApi: 'https://faviconsnap.com/api/favicon?url=',
        bgImages: [
            'https://t.alcy.cc/moez',
            'https://t.alcy.cc/moez?2',
            'https://t.alcy.cc/moez?3',
            'https://t.alcy.cc/moez?4',
            'https://t.alcy.cc/moez?5'
        ],
        bgRotateInterval: 12000,
        bgFadeDuration: 1200,
        hitokotoApi: 'https://v1.hitokoto.cn/?c=f&encode=json',
        hitokotoInterval: 10000,
        hitokotoTimeout: 5000,
        fallbackHitokotos: [
            '🌱 学而时习之，不亦说乎。',
            '🌱 静以修身，俭以养德。',
            '🌱 千里之行，始于足下。',
            '🌱 博观而约取，厚积而薄发。',
            '🌱 路漫漫其修远兮，吾将上下而求索。'
        ]
    };

    // ========== DOM 引用 ==========
    var el = {
        links: document.getElementById('linksContainer'),
        count: document.getElementById('linkCount'),
        runtime: document.querySelector('#runtime span'),
        hitokotoText: document.getElementById('hitokoto-text'),
        hitokotoFrom: document.getElementById('hitokoto-from'),
        themeBtn: document.getElementById('themeToggleBtn'),
        themeIcon: document.getElementById('themeIcon'),
        themeLabel: document.getElementById('themeLabel'),
        title: document.querySelector('.page-header h1'),
        subtitle: document.querySelector('.subtitle-text'),
        themeMeta: document.querySelector('meta[name="theme-color"]')
    };

    // ========== 存储工具（统一异常兜底） ==========
    function readJSON(key, fallback) {
        try {
            var raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (e) { return fallback; }
    }

    function writeJSON(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 配额满/隐私模式忽略 */ }
    }

    // ========== 链接渲染（内容签名去重：相同内容不重建，消除闪烁） ==========
    var renderedSignature = null;

    function linkSignature(links) {
        return links.map(function (l) {
            return [l.id, l.name, l.url, l.fallback, l.status].join('\u0001');
        }).join('\u0002');
    }

    // 空态/错误态共用一套小卡片；错误态带重试，绝不留下纯白屏
    function renderPlaceholder(kind) {
        el.links.textContent = '';
        renderedSignature = null;
        if (el.count) el.count.textContent = '0 个友邻';

        var box = document.createElement('div');
        box.style.cssText = 'text-align:center;padding:2.5rem;color:var(--color-muted)';

        if (kind === 'loading') {
            var skel = document.createElement('div');
            skel.className = 'loading-skeleton';
            skel.style.cssText = 'width:100%;height:50px;border-radius:100px;margin:0 auto';
            box.style.padding = '1.5rem';
            box.appendChild(skel);
            el.links.appendChild(box);
            return;
        }

        var face = document.createElement('p');
        face.style.cssText = 'font-size:2rem;margin-bottom:.5rem';
        face.textContent = kind === 'error' ? '⚠️' : '📭';

        var text = document.createElement('p');
        text.textContent = kind === 'error' ? '加载失败，请检查网络' : '暂无链接';

        box.appendChild(face);
        box.appendChild(text);

        if (kind === 'error') {
            var retry = document.createElement('button');
            retry.textContent = '重试';
            retry.style.cssText = 'margin-top:.9rem;padding:.45rem 1.3rem;border-radius:100px;' +
                'border:1px solid var(--color-rule);background:var(--color-paper-2);color:var(--color-ink);' +
                'font-family:inherit;font-size:.85rem;cursor:pointer';
            retry.addEventListener('click', function () {
                renderPlaceholder('loading');
                loadLinks(true);
            });
            box.appendChild(retry);
        }

        el.links.appendChild(box);
    }

    function renderLinks(links, animate) {
        var active = (links || []).filter(function (l) {
            return l && l.url && l.status !== 'inactive';
        });
        var signature = linkSignature(active);
        if (signature === renderedSignature) return false;   // 内容未变 → 不重建
        renderedSignature = signature;

        el.links.textContent = '';

        if (active.length === 0) {
            renderedSignature = null;
            renderPlaceholder('empty');
            return true;
        }

        if (el.count) el.count.textContent = active.length + ' 个友邻';

        var fragment = document.createDocumentFragment();
        var jobs = [];

        active.forEach(function (link, i) {
            var name = String(link.name || '');
            var url = String(link.url || '');

            var a = document.createElement('a');
            a.className = 'pill-link';
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.setAttribute('role', 'listitem');
            a.title = name;
            // 仅首屏入场用逐个延迟动画；静默更新不加延迟。
            // 基础样式 opacity:0 依赖 linkIn 动画回填为 1，禁用动画时必须显式恢复，否则卡片永久不可见
            if (animate) a.style.animationDelay = (0.06 * i).toFixed(2) + 's';
            else {
                a.style.animation = 'none';
                a.style.opacity = '1';
                a.style.transform = 'none';
            }

            var avatar = document.createElement('span');
            avatar.className = 'link-avatar';

            // 图标未就绪时先显示文字，避免空白
            var fallback = document.createElement('span');
            fallback.className = 'fallback-text';
            fallback.textContent = String(link.fallback || name.charAt(0) || '🔗');

            avatar.appendChild(fallback);

            var label = document.createElement('span');
            label.textContent = name;

            a.appendChild(avatar);
            a.appendChild(label);
            fragment.appendChild(a);

            jobs.push({ url: url, avatar: avatar, fallback: fallback });
        });

        el.links.appendChild(fragment);
        loadIcons(jobs);
        return true;
    }

    // ========== 图标（小并发 + 超时 + localStorage 缓存） ==========
    var iconQueueToken = 0;

    function loadIcons(jobs) {
        var cache = readJSON(CONFIG.iconCacheKey, {});
        var cursor = 0;
        // 每次渲染递增 token，旧队列（已被重建替换的 DOM）自动失效
        var token = ++iconQueueToken;

        jobs.forEach(function (job) {
            var b64 = cache[job.url];
            if (!b64) return;
            var img = document.createElement('img');
            img.alt = '';
            img.onload = function () {
                img.style.display = 'block';
                job.fallback.style.display = 'none';
            };
            img.src = 'data:image/png;base64,' + b64;
            job.avatar.appendChild(img);
        });

        function alive() { return token === iconQueueToken; }

        // 未缓存的按小并发逐个抓取；任何情况都必须推进游标，否则后续图标永不加载
        function next() {
            if (!alive()) return;
            while (cursor < jobs.length && cache[jobs[cursor].url]) cursor++;
            if (cursor >= jobs.length) return;
            var job = jobs[cursor++];
            var ctrl = new AbortController();
            var timer = setTimeout(function () { ctrl.abort(); }, CONFIG.iconTimeout);

            fetch(CONFIG.iconApi + encodeURIComponent(job.url), { signal: ctrl.signal })
                .then(function (r) { return r.ok ? r.blob() : Promise.reject(new Error('bad status')); })
                .then(function (blob) {
                    clearTimeout(timer);
                    if (!blob.size) throw new Error('empty');
                    var objectUrl = URL.createObjectURL(blob);
                    var img = document.createElement('img');
                    img.alt = '';
                    img.decoding = 'async';
                    img.onload = function () {
                        img.style.display = 'block';
                        job.fallback.style.display = 'none';
                        URL.revokeObjectURL(objectUrl);
                    };
                    img.onerror = function () { URL.revokeObjectURL(objectUrl); };
                    img.src = objectUrl;
                    job.avatar.appendChild(img);

                    // 跨域图标 canvas 会被污染，改用 blob→FileReader 转 base64 持久化
                    if (blob.size <= 512 * 1024) {
                        var reader = new FileReader();
                        reader.onload = function () {
                            var b64 = String(reader.result).split(',')[1];
                            if (b64) { cache[job.url] = b64; writeJSON(CONFIG.iconCacheKey, cache); }
                        };
                        reader.readAsDataURL(blob);
                    }
                })
                .catch(function () { /* 失败保持文字回退 */ })
                .then(next);
        }


        for (var i = 0; i < CONFIG.iconConcurrency; i++) next();
    }

    // ========== 链接数据（SSR 注入优先 → 本地快照 → 后台刷新） ==========
    // 首访：HTML 里已由 Worker 注入 __BOOT__，到达即渲染，无需等 /api/links
    // 回访：优先注入数据，回退 localStorage 快照；两者都用内容签名去重避免闪烁
    function bootData() {
        return (typeof window !== 'undefined' && window.__BOOT__) || null;
    }

    function loadLinks(force) {
        var boot = bootData();
        var snap = readJSON(CONFIG.linksCacheKey, null);
        var updatedAt = Number(localStorage.getItem(CONFIG.linksUpdatedKey) || 0);

        var bootLinks = boot && Array.isArray(boot.links) && boot.links.length ? boot.links : null;
        var snapLinks = snap && Array.isArray(snap.links) && snap.links.length ? snap.links : null;
        var snapTs = (snap && snap.ts) || 0;

        // 1) 注入数据（服务端读的 KV，最新）→ 立即渲染
        if (bootLinks) {
            renderLinks(bootLinks, false);
            writeJSON(CONFIG.linksCacheKey, { links: bootLinks, ts: Date.now() });
        } else if (snapLinks) {
            renderLinks(snapLinks, false);
        }

        var hasData = !!(bootLinks || snapLinks);

        // 2) 无注入但有新鲜快照且后台未改动 → 跳过请求（纯性能优化）
        //    有注入时总是后台刷新：HTML 边缘缓存最长 60s，注入数据可能滞后；
        //    刷新由内容签名去重，相同内容不重建 DOM，无闪烁代价
        if (!force && !bootLinks && hasData && snapTs >= updatedAt && (Date.now() - snapTs < CONFIG.linksCacheMaxAge)) return;

        // 3) 后台刷新

        // 3) 后台刷新
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, CONFIG.apiTimeout);

        fetch(CONFIG.apiLinks, { signal: ctrl.signal, cache: 'no-store' })
            .then(function (r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
            .then(function (data) {
                clearTimeout(timer);
                if (!data || !Array.isArray(data.links)) throw new Error('bad payload');
                writeJSON(CONFIG.linksCacheKey, { links: data.links, ts: Date.now() });
                renderLinks(data.links, !hasData);   // 仅完全无数据时用入场动画
            })
            .catch(function (e) {
                clearTimeout(timer);
                console.warn('链接加载失败:', e.message);
                if (hasData) return;                 // 已有内容 → 保持不动，下次访问再试
                renderPlaceholder('error');          // 完全无内容 → 明确错误态 + 重试
            });
    }

    // ========== 背景轮转（load 后启动，不阻塞 Load 事件） ==========
    var bgIndex = 0;
    var bgTimer = null;

    function rotateBackground() {
        var image = CONFIG.bgImages[bgIndex % CONFIG.bgImages.length];
        bgIndex++;
        // 复用单一背景层，交叉淡入（勿用 background-attachment:fixed：iOS Safari 下背景丢失/滚动卡顿）
        // 先取旧层再插入新层，避免把新层自己算进 stale
        var stale = document.querySelectorAll('.bg-layer');
        var layer = document.createElement('div');
        layer.className = 'bg-layer';
        layer.style.cssText = 'position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;' +
            'transition:opacity ' + (CONFIG.bgFadeDuration / 1000).toFixed(1) + 's ease-in-out;opacity:0;pointer-events:none;' +
            'background-image:url("' + image + '")';
        document.body.insertBefore(layer, document.body.firstChild);
        requestAnimationFrame(function () { layer.style.opacity = '1'; });
        stale.forEach(function (node) { node.style.opacity = '0'; });
        setTimeout(function () {
            stale.forEach(function (node) { node.remove(); });
        }, CONFIG.bgFadeDuration + 100);
    }

    function initBackground() {
        rotateBackground();
        bgTimer = setInterval(rotateBackground, CONFIG.bgRotateInterval);
    }

    // ========== 运行时间 ==========
    var startDate = new Date(String(getStartDate()).replace(' ', 'T'));

    function getStartDate() {
        var settings = readJSON(CONFIG.settingsKey, null);
        return (settings && settings.startDate) || CONFIG.startDate;
    }

    function updateRuntime() {
        if (!el.runtime) return;
        var diff = Math.max(0, Math.floor((Date.now() - startDate.getTime()) / 1000));
        var days = Math.floor(diff / 86400);
        diff %= 86400;
        var pad = function (n) { return String(n).padStart(2, '0'); };
        el.runtime.textContent = days + '天 ' + pad(Math.floor(diff / 3600)) + ':' +
            pad(Math.floor((diff % 3600) / 60)) + ':' + pad(diff % 60);
    }

    // 对齐到秒边界，避免 1000ms 定时器空转漂移
    function scheduleRuntime() {
        updateRuntime();
        setTimeout(scheduleRuntime, 1000 - new Date().getMilliseconds());
    }

    // ========== 一言 ==========
    var hitokotoTimer = null;

    function setHitokoto(text, from) {
        if (!el.hitokotoText) return;
        el.hitokotoText.style.opacity = '0';
        setTimeout(function () {
            el.hitokotoText.textContent = text;
            if (el.hitokotoFrom) el.hitokotoFrom.textContent = from || '';
            el.hitokotoText.style.opacity = '1';
        }, 400);
    }

    function fetchHitokoto() {
        var ctrl = new AbortController();
        var timer = setTimeout(function () { ctrl.abort(); }, CONFIG.hitokotoTimeout);
        fetch(CONFIG.hitokotoApi, { signal: ctrl.signal })
            .then(function (r) {
                clearTimeout(timer);
                if (!r.ok) throw new Error('bad status');
                return r.json();
            })
            .then(function (data) {
                if (!data || !data.hitokoto) throw new Error('empty');
                setHitokoto('「' + data.hitokoto + '」', data.from ? '—— ' + data.from : '');
            })
            .catch(function () {
                var list = CONFIG.fallbackHitokotos;
                setHitokoto(list[Math.floor(Math.random() * list.length)], '');
            });
    }

    // ========== 主题 ==========
    function applyTheme(theme) {
        var dark = theme === 'dark';
        if (dark) document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        if (el.themeIcon) el.themeIcon.textContent = dark ? '☀️' : '🌙';
        if (el.themeLabel) el.themeLabel.textContent = dark ? '浅色' : '深色';
        if (el.themeMeta) el.themeMeta.setAttribute('content', dark ? '#1a1512' : '#f5ebe0');
        try { localStorage.setItem(CONFIG.themeKey, theme); } catch (e) {}
    }

    function currentTheme() {
        return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    // ========== 站点设置（本地缓存 + 云端覆盖，单一写入路径） ==========
    function applySettings(settings) {
        if (!settings) return;
        if (settings.title && el.title) el.title.textContent = settings.title;
        if (settings.subtitle && el.subtitle) el.subtitle.textContent = settings.subtitle;
        if (settings.startDate) {
            var parsed = new Date(String(settings.startDate).replace(' ', 'T'));
            if (!isNaN(parsed.getTime())) {
                startDate = parsed;
                updateRuntime();
            }
        }
    }

    function loadSettings() {
        var boot = bootData();
        if (boot && boot.settings) {
            writeJSON(CONFIG.settingsKey, boot.settings);
            applySettings(boot.settings);
        } else {
            applySettings(readJSON(CONFIG.settingsKey, null));
        }

        fetch(CONFIG.apiSettings)
            .then(function (r) { if (!r.ok) throw new Error('API ' + r.status); return r.json(); })
            .then(function (data) {
                if (!data.settings) return;
                // 无条件回写：回访时本地缓存即为最新云端值
                writeJSON(CONFIG.settingsKey, data.settings);
                applySettings(data.settings);
            })
            .catch(function () { /* 保留本地设置 */ });
    }

    // ========== 启动 ==========
    loadLinks();
    loadSettings();

    applyTheme(localStorage.getItem(CONFIG.themeKey) ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

    if (el.themeBtn) {
        el.themeBtn.addEventListener('click', function () {
            applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
        });
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
        if (!localStorage.getItem(CONFIG.themeKey)) applyTheme(e.matches ? 'dark' : 'light');
    });

    scheduleRuntime();

    // 背景与一言延后启动：主内容优先，不抢占首屏带宽
    var startBackground = function () { setTimeout(initBackground, 0); };
    if (document.readyState === 'complete') startBackground();
    else window.addEventListener('load', startBackground);

    setTimeout(function () {
        fetchHitokoto();
        hitokotoTimer = setInterval(fetchHitokoto, CONFIG.hitokotoInterval);
    }, 1500);

    window.addEventListener('beforeunload', function () {
        if (hitokotoTimer) clearInterval(hitokotoTimer);
        if (bgTimer) clearInterval(bgTimer);
    });
})();
</script>
</body>
</html>
